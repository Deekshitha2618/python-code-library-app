---
services:
  db:
    image: deekshitha261830/app-docker:db
    deploy:
      replicas: 3
    ports:
      - "3306:3306"
    networks:
      - mynetwork

  auth_service:
    image: deekshitha261830/app-docker:auth
    deploy:
      replicas: 3
    ports:
      - "5001:5001"
    networks:
      - mynetwork
    depends_on:
      - db
    

  book_service:
    image: deekshitha261830/app-docker:book
    deploy:
      replicas: 3
    ports:
      - "5002:5002"
    networks:
      - mynetwork
    depends_on:
      - db
  borrow_service:
    image: deekshitha261830/app-docker:borrow
    deploy:
      replicas: 3
    ports:
      - "5003:5003"
    networks:
      - mynetwork
    depends_on:
      - db

  frontend:
    image: deekshitha261830/app-docker:frontend
    deploy:
      replicas: 3
    ports:
      - "5000:5000"
    networks:
      - mynetwork
    depends_on:
      - auth_service
      - book_service
      - borrow_service

networks:
  mynetwork:
    driver: overlay
